
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我是你的谁？</title>
    <link rel="stylesheet" href="../assets/css/name.css">
</head>
<body id="body">
    <div class="container">
        <img id="mainImage" src="../assets/images/name.gif" alt="龙图">
        <h1 id="question">刘财福是你的谁？</h1>
        <div class="buttons">
            <button  onclick="window.location.href='truth.html'" id="yes">爸爸</button>
            <button  type="button" id="no">儿子</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const button = document.getElementById('no');
            const other = document.getElementById('yes');
            
            // 定义按钮的不同模式和对应的文字
            const modes = [
                { scale: 1, text: "儿子"},
                { scale: 0.8, text: "再说一遍？"},
                { scale: 0.6, text: "最后一次机会..."},
                { scale: 0.5, text: "快叫！"}
            ];
            
            let currentMode = 0;
            
            button.addEventListener('click', function() {
                // 更新当前模式
                if(currentMode == 3){
                    currentMode = currentMode;
                }else{
                    currentMode = currentMode + 1;
                }
                
                const mode = modes[currentMode];
                
                // 应用新模式
                other.style.transform = `scale(${2-mode.scale})`;
                button.style.transform = `scale(${mode.scale})`;
                button.textContent = mode.text;
            });
        });
        
    </script>
</body>
</html>
